name: CI

on:
  push:
    branches: [master, main, mvp]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Sin Supabase configurado: la app se construye con la interfaz vacía (sin datos simulados).
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10 (el de Node 22) no resuelve bien las dependencias opcionales de @emnapi: ver DECISIONS.md (fase G).
      - run: npx -y npm@11.6.2 ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

      - name: Sin claves de servidor en el bundle del cliente
        run: |
          if grep -rIl -E "SERVICE_ROLE|service_role|CONTACT_IP_SALT|CRON_SECRET" .next/static; then
            echo "::error::Hay referencias a secretos de servidor en .next/static"
            exit 1
          fi

      # Tests e2e y visuales DESACTIVADOS hasta configurar Supabase: necesitan anuncios, y la app ya
      # no trae datos simulados. Para reactivarlos: Supabase local + scripts/seed-local-demo.mts y
      # ejecutarlos contra esos datos (docs/DECISIONS.md, «Sin mocks en la app»).

  database:
    # DESACTIVADO hasta configurar Supabase (decisión del titular). Quitar `if: false` para reactivarlo.
    if: false
    # Migraciones y tests de seguridad (RLS, privilegios, Storage, búsqueda) contra Supabase LOCAL
    # en Docker. Nunca usa el proyecto remoto ni sus claves.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10 (el de Node 22) no resuelve bien las dependencias opcionales de @emnapi: ver DECISIONS.md (fase G).
      - run: npx -y npm@11.6.2 ci

      - name: Supabase local
        run: npm run db:start

      - name: Lint de la base de datos
        run: npm run db:lint

      - name: Tests de seguridad (pgTAP)
        run: npm run db:test

      - name: Paridad mock ↔ Supabase (local)
        run: npm run test:integration

      - name: Parar Supabase
        if: always()
        run: npm run db:stop
