name: CI

on:
  push:
    branches: [master, main, mvp]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fase A: sin backend. Los datos son el inventario DEMO en memoria.
      REBOARD_DATA_SOURCE: mock
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10 (el de Node 22) no resuelve bien las dependencias opcionales de @emnapi: ver DECISIONS.md (fase G).
      - run: npx -y npm@11.6.2 ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      - name: Build
        run: npm run build

      - name: Sin claves de servidor en el bundle del cliente
        run: |
          if grep -rIl -E "SERVICE_ROLE|service_role|CONTACT_IP_SALT|CRON_SECRET" .next/static; then
            echo "::error::Hay referencias a secretos de servidor en .next/static"
            exit 1
          fi

      - name: Navegador de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests e2e
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  database:
    # Migraciones y tests de seguridad (RLS, privilegios, Storage, búsqueda) contra Supabase LOCAL
    # en Docker. Nunca usa el proyecto remoto ni sus claves.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10 (el de Node 22) no resuelve bien las dependencias opcionales de @emnapi: ver DECISIONS.md (fase G).
      - run: npx -y npm@11.6.2 ci

      - name: Supabase local
        run: npm run db:start

      - name: Lint de la base de datos
        run: npm run db:lint

      - name: Tests de seguridad (pgTAP)
        run: npm run db:test

      - name: Paridad mock ↔ Supabase (local)
        run: npm run test:integration

      - name: Parar Supabase
        if: always()
        run: npm run db:stop
